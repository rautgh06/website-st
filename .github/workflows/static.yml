name: Deploy Vite App

on:
  push:
    branches: ["main"] # Change to master if your default branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Upgraded to modern Node 22 to clear deprecation errors

      - name: Install Dependencies & Build
        run: |
          cd artifacts/syspro-technologies
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Upload Production Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/syspro-technologies/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
